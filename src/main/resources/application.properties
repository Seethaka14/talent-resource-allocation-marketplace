
spring.application.name=talent-resource-marketplace

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/talent_marketplace}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

server.port=8080

# Server Session and Cookie Security
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=false

ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:llama3.2:3b}
ollama.timeout-seconds=120
ollama.max-tool-iterations=3

# Flyway Database Migration Configuration
# Default: disabled to strictly preserve existing live database until explicit manual adoption.
# For clean deployments, set spring.flyway.enabled=true and spring.jpa.hibernate.ddl-auto=validate.
spring.flyway.enabled=false
spring.flyway.locations=classpath:db/migration
